[build-system]
# setuptools builds the optional C extension (see setup.py); bdist_wheel is
# built in since setuptools 70.1.
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "perf"
version = "0.12.0"
description = "A zero-dependency call-tree profiler / tracer for Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "thang", email = "adc05102002@gmail.com" }]
keywords = ["profiler", "tracing", "performance", "call-tree", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Benchmark",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/adc0510/performance"
Source = "https://github.com/adc0510/performance"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perf = ["py.typed"]

[tool.setuptools.exclude-package-data]
perf = ["*.c"]  # compiled into perf._speedups; the sdist still ships it
