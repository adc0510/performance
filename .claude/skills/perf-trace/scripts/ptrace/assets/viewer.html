<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>perf trace · __PERF_TITLE__</title>
<style>
:root {
  --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --soft: #eaeef2;
  --sel: #dbeafe; --hover: #f3f4f6; --bar: #93c5fd; --err: #cf222e; --warn: #9a6700;
  --ok: #1a7f37; --code: #f6f8fa; --accent: #0969da; --str: #0a3069; --num: #0550ae;
  --key: #8250df; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --line: #30363d; --soft: #21262d;
    --sel: #1c3557; --hover: #161b22; --bar: #1f6feb; --err: #f85149; --warn: #d29922;
    --ok: #3fb950; --code: #161b22; --accent: #58a6ff; --str: #a5d6ff; --num: #79c0ff; --key: #d2a8ff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: var(--soft); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.on { background: var(--sel); border-color: var(--accent); }
a, .link { color: var(--accent); cursor: pointer; text-decoration: none; }
a:hover, .link:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.err { color: var(--err); }
.warn { color: var(--warn); }

header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
header .facts { color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
header .spacer { flex: 1; }
header input { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; width: 260px; }
.tabs { display: flex; gap: 4px; }

main { flex: 1; display: grid; grid-template-columns: minmax(300px, 1fr) 5px minmax(300px, var(--right, 42%)); min-height: 0; }
#left { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#split { cursor: col-resize; background: var(--line); }
#right { overflow: auto; padding: 12px 16px 40px; min-width: 0; }
.pane { flex: 1; overflow: auto; min-height: 0; display: none; }
.pane.show { display: block; }

#results { border-bottom: 1px solid var(--line); max-height: 40%; overflow: auto; display: none; }
#results.show { display: block; }
#results .head { position: sticky; top: 0; background: var(--bg); padding: 6px 10px; border-bottom: 1px solid var(--soft); display: flex; gap: 8px; }
#results .head .spacer { flex: 1; }
.res { padding: 3px 10px; cursor: pointer; display: flex; gap: 10px; white-space: nowrap; }
.res:hover { background: var(--hover); }
.res .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 12px; }

/* call tree */
.thead, .row { display: flex; align-items: center; gap: 8px; padding: 1px 10px; white-space: nowrap; }
.thead { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; padding-top: 4px; padding-bottom: 4px; }
.row { cursor: default; font-family: var(--mono); font-size: 12px; height: 21px; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
.row .nm { flex: 1 0 auto; padding-left: 4px; }
#tree, #pane-tree .thead { min-width: max-content; }
.row .tg { display: inline-block; width: 14px; color: var(--muted); cursor: pointer; text-align: center; }
.row .cnt { color: var(--muted); }
.row.raised .nm .fn, .row.exc .nm .fn { color: var(--err); }
.row.unf .nm .fn { color: var(--warn); }
.badge { font-size: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 0 5px; margin-left: 6px; color: var(--muted); font-family: var(--mono); }
.badge.err { color: var(--err); border-color: var(--err); }
.c-bar { width: 90px; height: 8px; background: var(--soft); border-radius: 2px; overflow: hidden; flex: none; }
.c-bar i { display: block; height: 100%; background: var(--bar); }
.c-t, .c-s { width: 74px; text-align: right; flex: none; }
.c-p { width: 46px; text-align: right; flex: none; color: var(--muted); }
.more { padding: 2px 10px; font-size: 12px; }

/* function table */
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--soft); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: right; }
td.fnc { font-family: var(--mono); font-size: 12px; max-width: 0; min-width: 140px; width: 100%; overflow: hidden; text-overflow: ellipsis; }
#fn-table { width: auto; min-width: 100%; }
#fn-table td.fname { font-family: var(--mono); font-size: 12px; width: 100%; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--hover); }
tbody tr.sel { background: var(--sel); }

/* flame */
#flame-wrap { position: relative; }
#flame-bar { padding: 6px 10px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; }
#flame-crumbs { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
#flame { display: block; }
#pane-flame { overflow-x: hidden; }
#tip { position: fixed; pointer-events: none; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: none; z-index: 10; max-width: 480px; }

/* detail panel */
#right h2 { font-family: var(--mono); font-size: 14px; margin: 0 0 6px; word-break: break-all; }
#right h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
.crumbs { font-family: var(--mono); font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
.crumbs .sep { color: var(--muted); margin: 0 4px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; }
.kv .k { color: var(--muted); }
.arg { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; font-family: var(--mono); font-size: 12px; }
.kv { grid-template-columns: max-content minmax(0, 1fr); }
.v, .kv > span { overflow-wrap: anywhere; }
.arg .k { color: var(--key); }
pre { background: var(--code); border: 1px solid var(--soft); border-radius: 6px; padding: 8px; overflow: auto; font-size: 12px; margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
.empty { color: var(--muted); padding: 30px 10px; }
.note { color: var(--muted); font-size: 12px; margin-top: 4px; }

/* value viewer */
.v { font-family: var(--mono); font-size: 12px; }
.v details { display: inline; }
.v details[open] { display: block; }
.v summary { cursor: pointer; display: inline; list-style: none; }
.v summary::-webkit-details-marker { display: none; }
.v summary::before { content: "▸ "; color: var(--muted); }
.v details[open] > summary::before { content: "▾ "; }
.v .body { margin-left: 16px; border-left: 1px solid var(--soft); padding-left: 8px; }
.v .s { color: var(--str); white-space: pre-wrap; word-break: break-word; }
.v .num { color: var(--num); }
.v .lit { color: var(--key); }
.v .mk { color: var(--muted); font-style: italic; }
.v .ty { color: var(--warn); }
.v .k { color: var(--key); }

/* locals */
.loc { table-layout: fixed; }
.loc td { vertical-align: top; font-family: var(--mono); font-size: 12px; white-space: normal; overflow-wrap: anywhere; }
.loc td.ln { color: var(--muted); text-align: right; width: 48px; white-space: nowrap; }
.loc td.src { white-space: pre; color: var(--fg); width: 38%; overflow: hidden; text-overflow: ellipsis; }
.loc tr { cursor: default; }
.loc tr.raise td { background: color-mix(in srgb, var(--err) 12%, transparent); }
.chip { display: inline-block; margin: 0 10px 2px 0; }
.chip .k { color: var(--key); }

/* call graph */
#pane-graph.show { display: flex; flex-direction: column; overflow: hidden; }
#graph-bar { padding: 6px 10px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 12px; }
#graph-bar label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
#graph-bar label[hidden] { display: none; }
#graph-bar output { font-family: var(--mono); color: var(--fg); min-width: 54px; }
#graph-stage { flex: 1; position: relative; overflow: hidden; cursor: grab; min-height: 0; }
#graph-stage.dragging { cursor: grabbing; }
#graph-svg { width: 100%; height: 100%; display: block; }
.g-n rect.box { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.g-n.err rect.box { stroke: var(--err); stroke-width: 1.6; }
.g-n.root rect.box { stroke: var(--accent); stroke-width: 2; }
.g-n.sel rect.box { stroke: var(--accent); stroke-width: 2.5; }
.g-n.match rect.box { fill: var(--sel); }
.g-n.focus rect.box { stroke: var(--accent); stroke-width: 3; }
.g-n.caller rect.box { stroke: var(--key); stroke-width: 2.5; }
.g-n.callee rect.box { stroke: var(--ok); stroke-width: 2.5; }
.tl-row.dim { opacity: .3; }
#link-btn.on { border-color: var(--warn); color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
#link-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 10px; font-size: 12px;
  border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--warn) 8%, transparent); }
#link-bar[hidden] { display: none; }
#link-bar label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
#link-bar input { font: 12px var(--mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; width: 230px; }
.g-n.lk rect.box { stroke: var(--warn); stroke-width: 2.5; }
.g-n.lk-end rect.box { stroke: var(--warn); stroke-width: 4; fill: color-mix(in srgb, var(--warn) 14%, var(--bg)); }
.g-n.lk-dim, .g-e.lk-dim { opacity: .15; }
.g-e.lkpath path { stroke: var(--warn); stroke-dasharray: none; opacity: 1; }
.g-e.lkpath text { fill: var(--warn); }
#graph-svg marker.lk path { fill: var(--warn); }
.tl-row.lk-dim { opacity: .3; }
.lk-chain { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; cursor: pointer; }
.lk-chain:hover { border-color: var(--warn); }
.lk-chain.on { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.lk-chain-head { display: flex; gap: 6px; align-items: baseline; margin-bottom: 4px; }
.lk-chain-head .spacer { flex: 1; }
.lk-steps { font: 12px var(--mono); line-height: 1.7; overflow-wrap: anywhere; }
.lk-steps .sep { color: var(--muted); margin: 0 5px; }
.lk-endname { color: var(--warn); font-weight: 600; }
.lk-leg { font-size: 11px; margin-top: 4px; }
.lg rect.lkbox { fill: var(--bg); stroke: var(--warn); stroke-width: 2.5; }
.lg .l-lk { stroke: var(--warn); }
.g-n text.t { fill: var(--fg); font: 600 12px var(--mono); }
.g-n text.s { fill: var(--muted); font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.g-n text.x { fill: var(--err); font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.g-n { cursor: pointer; }
.g-n.dim, .g-e.dim { opacity: .15; }
.g-e path { fill: none; stroke: var(--muted); }
.g-e.hot path { stroke: var(--accent); }
.g-e.skip path { stroke-dasharray: 9 5; }
.g-e.aux { display: none; }
.g-e.aux path { stroke: var(--key); stroke-dasharray: 0.5 5; stroke-linecap: round; }
.g-e.aux text { fill: var(--key); }
.g-e.aux.show, #graph-view.all .g-e.aux { display: inline; }
#graph-view.all .g-e.aux:not(.show) { opacity: .45; }
.g-n text.m { fill: var(--muted); font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.g-e text { fill: var(--muted); font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.g-e text.err { fill: var(--err); }
.g-lbl { fill: var(--bg); }
#graph-svg marker path { fill: var(--muted); }
#graph-svg marker.aux path { fill: var(--key); }
#pane-graph { position: relative; }
#graph-legend { position: absolute; right: 16px; bottom: 12px; z-index: 3; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px 8px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
#graph-legend[hidden] { display: none; }
#graph-legend .lg-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-bottom: 2px; }
#graph-legend .lg-head span.link { text-transform: none; letter-spacing: 0; font-weight: 400; }
#graph-legend svg { display: block; }
.lg text { fill: var(--fg); font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.lg text.m { fill: var(--muted); }
.lg text.mono { font: 600 11px var(--mono); }
.lg text.err { fill: var(--err); }
.lg text.key { fill: var(--key); }
.lg line { fill: none; }
.lg .f-hot { fill: var(--accent); stroke: none; }
.lg .f-aux { fill: var(--key); stroke: none; }
.lg .f-dir { fill: var(--muted); stroke: none; }
.lg .l-hot { stroke: var(--accent); }
.lg .l-dir { stroke: var(--muted); }
.lg .l-skip { stroke: var(--muted); stroke-dasharray: 9 5; }
.lg .l-aux { stroke: var(--key); stroke-dasharray: 0.5 5; stroke-linecap: round; }
.lg rect.box { fill: var(--bg); stroke: var(--line); }
.lg rect.err-tick { fill: var(--err); }
.lg rect.lg-win { fill: color-mix(in srgb, var(--accent) 16%, transparent); stroke: var(--accent); stroke-width: 1.5; }
.lg rect.callerbox { fill: var(--bg); stroke: var(--key); stroke-width: 2.5; }
.lg rect.calleebox { fill: var(--bg); stroke: var(--ok); stroke-width: 2.5; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; }
.seg button:first-child { border-radius: 6px 0 0 6px; }
.seg button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
#tl-stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#tl-stage[hidden] { display: none; }
#tl-head { display: block; flex: none; height: 30px; width: 100%; border-bottom: 1px solid var(--line); cursor: crosshair; }
#tl-ov { display: block; flex: none; height: 46px; width: 100%; border-bottom: 1px solid var(--line); cursor: crosshair; }
#tl-zoom { color: var(--muted); }
#tl-zoom[hidden] { display: none; }
.tl-ov-bg { fill: var(--hover); }
.tl-ov-d { fill: var(--muted); opacity: .5; }
.tl-ov-label { fill: var(--muted); font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.tl-win { fill: color-mix(in srgb, var(--accent) 16%, transparent); stroke: var(--accent); stroke-width: 1.5; cursor: grab; }
.tl-brush { fill: color-mix(in srgb, var(--accent) 22%, transparent); stroke: var(--accent); stroke-dasharray: 3 2; pointer-events: none; }
#tl-body { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; cursor: grab; }
#tl-body.dragging { cursor: grabbing; }
#tl-svg { display: block; width: 100%; }
.tl-row.alt rect.bg { fill: var(--hover); }
.tl-row rect.bg { fill: transparent; }
.tl-row.sel rect.bg { fill: var(--sel); }
.tl-row.match rect.bg { fill: color-mix(in srgb, var(--accent) 22%, transparent); }
.tl-row text.t { fill: var(--fg); font: 12px var(--mono); cursor: pointer; }
.tl-row text.t:hover { fill: var(--accent); }
.tl-row text.s { fill: var(--muted); font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.tl-err { fill: var(--err); }
.tl-axis line { stroke: var(--line); }
.tl-axis text { fill: var(--muted); font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.tl-grid { stroke: var(--line); stroke-dasharray: 2 4; opacity: .6; }
.tl-guide { stroke: var(--accent); stroke-width: 1; pointer-events: none; }
.tl-guide-t { fill: var(--accent); font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.tl-split { stroke: var(--line); }
#graph-svg marker.hot path { fill: var(--accent); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="facts" id="facts"></div>
  <div class="spacer"></div>
  <div class="tabs">
    <button data-tab="tree" class="on">Call tree</button>
    <button data-tab="graph">Call graph</button>
    <button data-tab="fns">Functions</button>
    <button data-tab="flame">Flame</button>
  </div>
  <button id="btn-errors">Errors</button>
  <input id="q" type="search" placeholder="Find calls by name, or #id" autocomplete="off">
</header>
<main>
  <div id="left">
    <div id="results"></div>
    <div class="pane show" id="pane-tree">
      <div class="thead"><span class="c-t">wall</span><span class="c-s">self</span><span class="c-p">%tot</span><span class="c-bar"></span><span style="flex:1;padding-left:4px">call</span></div>
      <div id="tree"></div>
    </div>
    <div class="pane" id="pane-graph">
      <div id="graph-bar">
        <span class="seg"><button data-gview="graph" class="on">Graph</button><button data-gview="timeline">Timeline</button></span>
        <label>Functions shown <input id="graph-top" type="range" min="2" step="1"> <output id="graph-top-out"></output></label>
        <label id="graph-all-l"><input id="graph-all" type="checkbox"> All callers</label>
        <span class="seg"><button id="g-zout" title="zoom out (−)">−</button><button id="g-zin" title="zoom in (+)">+</button></span>
        <button id="graph-fit">Fit</button>
        <span id="tl-zoom" class="mono" hidden></span>
        <button id="graph-svg-dl">Download SVG</button>
        <button id="graph-legend-btn" class="on">Legend</button>
        <button id="link-btn" title="Find how two functions are connected">Find link</button>
        <span class="muted" id="graph-hint"></span>
      </div>
      <div id="link-bar" hidden>
        <span class="muted">Click two boxes, or type:</span>
        <label>From <input id="link-from" list="fn-names" placeholder="function" autocomplete="off"></label>
        <button id="link-swap" title="swap From and To">⇄</button>
        <label>To <input id="link-to" list="fn-names" placeholder="function" autocomplete="off"></label>
        <button id="link-clear">Clear</button>
        <span class="muted">Find link is on: clicks pick the ends. Turn it off to get the normal click highlight back.</span>
        <datalist id="fn-names"></datalist>
      </div>
      <div id="graph-stage"><svg id="graph-svg" xmlns="http://www.w3.org/2000/svg"><defs id="graph-defs"></defs><g id="graph-view"></g></svg></div>
      <div id="graph-legend"><div class="lg-head">Legend <span class="link" id="graph-legend-x">hide</span></div><div id="graph-legend-body"></div></div>
      <div id="tl-stage" hidden>
        <svg id="tl-head" xmlns="http://www.w3.org/2000/svg"></svg>
        <svg id="tl-ov" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="tl-body"><svg id="tl-svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
      </div>
    </div>
    <div class="pane" id="pane-fns"><table id="fn-table"><thead></thead><tbody></tbody></table></div>
    <div class="pane" id="pane-flame">
      <div id="flame-bar"><button id="flame-reset">Reset zoom</button><div id="flame-crumbs"></div><span class="muted">click: zoom + details</span></div>
      <div id="flame-wrap"><canvas id="flame"></canvas></div>
    </div>
  </div>
  <div id="split"></div>
  <div id="right"><div class="empty">Select a call in the tree, a function in the call graph or table, or a bar in the flame view.</div></div>
</main>
<div id="tip"></div>
<script id="data" type="application/json">/*__PERF_DATA__*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const N = D.f.length;
const F = { EXC: 1, RAISED: 2, UNFINISHED: 4, LOCALS: 8, CACHE_HIT: 16, CACHE_MISS: 32, GENERATOR: 64, SUPPRESSED: 128 };
const PAGE = 200;

// ── helpers ─────────────────────────────────────────────────────────────────
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function fmtT(x) {
  if (x === null || x === undefined) return "unfinished";
  if (x >= 1) return x.toFixed(2) + " s";
  if (x >= 1e-3) return (x * 1e3).toFixed(1) + " ms";
  return (x * 1e6).toFixed(0) + " µs";

// Call chains between a and b. kind "down": b ran under a; "up": a ran under b; "common":
// neither, so the chains meet in a common caller. Each chain lists every function on the way,
// including ones the graph does not show. Chains with the same functions are grouped.
function findLink(a, b) {
  const groups = new Map();
  const add = (key, fns, legs, n, t, example) => {
    const g = groups.get(key) || groups.set(key, { fns, legs, n: 0, t: 0, example }).get(key);
    g.n += n; g.t += t;
  };
  const chainUp = (c, stopFn) => {   // functions from c up to its nearest ancestor call of stopFn
    const fns = [D.f[c]];
    for (let x = D.p[c]; x !== -1; x = D.p[x]) { fns.push(D.f[x]); if (D.f[x] === stopFn) return fns.reverse(); }
    return null;
  };
  const direct = (top, bottom) => {
    for (const c of callsOf[bottom]) {
      const fns = chainUp(c, top);
      if (fns) add(fns.join(">"), fns, [fns], 1, tEff(c), c);
    }
  };
  let kind = "down";
  direct(a, b);
  if (!groups.size) { kind = "up"; direct(b, a); }
  if (!groups.size && a !== b) {
    kind = "common";
    // mark every call above a call of a; climbing from each call of b, the first marked call is
    // where the two chains meet (their lowest common caller)
    const above = new Uint8Array(N);
    for (const c of callsOf[a]) for (let x = D.p[c]; x !== -1 && !above[x]; x = D.p[x]) above[x] = 1;
    const aSorted = callsOf[a];   // preorder ids, ascending
    for (const c of callsOf[b]) {
      let m = D.p[c];
      while (m !== -1 && !above[m]) m = D.p[m];
      if (m === -1) continue;
      let lo = 0, hi = aSorted.length - 1, k = -1;   // first call of a inside m's subtree
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (aSorted[mid] > m) { k = mid; hi = mid - 1; } else lo = mid + 1; }
      if (k < 0 || aSorted[k] > subEnd[m]) continue;
      const toA = chainUp(aSorted[k], D.f[m]), toB = chainUp(c, D.f[m]);
      if (!toA || !toB) continue;
      add(toA.join(">") + "|" + toB.join(">"), [D.f[m]], [toA, toB], 1, tEff(c), c);
    }
  }
  const chains = [...groups.values()].sort((x, y) => y.n - x.n || x.fns.length - y.fns.length);
  return { kind, a, b, chains };
}

  ev.preventDefault();
  const tAt = x => TL.v0 + (Math.min(Math.max(x, TL.LW), TL.LW + tlTW()) - TL.LW) / tlTW() * (TL.v1 - TL.v0);
  const brush = svgEl("rect", { class: "tl-brush", x: x0, y: 1, width: 0, height: 28 }, tlHead);
  const move = e => { const x = tlTrackX(tlHead, e); brush.setAttribute("x", Math.min(x, x0)); brush.setAttribute("width", Math.abs(x - x0)); };
  const up = e => {
    removeEventListener("mousemove", move); removeEventListener("mouseup", up); brush.remove();
    const x = tlTrackX(tlHead, e);
    if (Math.abs(x - x0) > 4) { const a = tAt(Math.min(x, x0)), b = tAt(Math.max(x, x0)); tlSetWindow(a, b); }
  };
  addEventListener("mousemove", move); addEventListener("mouseup", up);
});
// overview: drag the box to pan, drag elsewhere to pick a range, click to centre the window there
tlOv.addEventListener("mousedown", ev => {
  const x0 = tlTrackX(tlOv, ev);
  if (ev.button !== 0 || x0 < TL.LW) return;
  ev.preventDefault();
  const TW = tlTW(), tAt = x => (Math.min(Math.max(x, TL.LW), TL.LW + TW) - TL.LW) / TW * TOTAL;
  const t0 = tAt(x0), v0 = TL.v0, v1 = TL.v1, inside = t0 >= v0 && t0 <= v1;
  const brush = inside ? null : svgEl("rect", { class: "tl-brush", x: x0, y: 2, width: 0, height: TL_OVH - 4 }, tlOv);
  let moved = false;
  const move = e => {
    const x = tlTrackX(tlOv, e);
    if (Math.abs(x - x0) > 3) moved = true;
    if (inside) { const dt = tAt(x) - t0; tlSetWindow(v0 + dt, v1 + dt); }
    else { brush.setAttribute("x", Math.min(x, x0)); brush.setAttribute("width", Math.abs(x - x0)); }
  };
  const up = e => {
    removeEventListener("mousemove", move); removeEventListener("mouseup", up);
    if (brush) brush.remove();
    if (inside) return;
    const x = tlTrackX(tlOv, e);
    if (moved && Math.abs(x - x0) > 4) tlSetWindow(tAt(Math.min(x, x0)), tAt(Math.max(x, x0)));
    else { const span = v1 - v0; tlSetWindow(t0 - span / 2, t0 + span / 2); }
  };
  addEventListener("mousemove", move); addEventListener("mouseup", up);
});
for (const [svg, full] of [[tlHead, false], [tlOv, true]]) svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const x = tlTrackX(svg, ev), frac = (x - TL.LW) / tlTW();
  const at = full ? frac * TOTAL : TL.v0 + frac * (TL.v1 - TL.v0);
  tlZoomBy(Math.exp((ev.deltaY || ev.deltaX) * 0.002), at);
}, { passive: false });
// keys while the timeline is showing: + / − zoom, ← / → pan, 0 = whole run
addEventListener("keydown", ev => {
  if (tab !== "graph" || gViewMode !== "timeline" || /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key;
  if (k === "+" || k === "=") tlZoomBy(0.5);
  else if (k === "-" || k === "_") tlZoomBy(2);
  else if (k === "ArrowLeft") tlPanBy(-0.2);
  else if (k === "ArrowRight") tlPanBy(0.2);
  else if (k === "0") tlSetWindow(0, TOTAL);
  else return;
  ev.preventDefault();
});
// ── search and error list ───────────────────────────────────────────────────
const results = document.getElementById("results");
function showResults(title, ids, extra) {
  results.replaceChildren();
  const head = el("div", "head"); head.appendChild(el("b", "", title)); head.appendChild(el("span", "spacer"));
  const x = el("span", "link", "close"); x.onclick = () => results.classList.remove("show"); head.appendChild(x);
  results.appendChild(head);
  for (const id of ids.slice(0, 500)) {
    const r = el("div", "res");
    r.appendChild(el("span", "nm" + (has(id, F.RAISED) ? " err" : ""), name(id) + (extra ? "  " + extra(id) : "")));
    r.appendChild(el("span", "muted", "#" + id));
    r.appendChild(el("span", "", fmtT(tEff(id))));
    r.onclick = () => { if (tab === "fns") showTab("tree"); goto(id); };
    results.appendChild(r);
  }
  if (ids.length > 500) results.appendChild(el("div", "note", "  " + (ids.length - 500) + " more: refine the search"));
  results.classList.add("show");
}
let qTimer = 0;
document.getElementById("q").addEventListener("input", () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    const q = document.getElementById("q").value.trim();
    if (tab === "fns") renderFnTable();
    graphHighlight(document.getElementById("q").value);
    if (!q) { results.classList.remove("show"); return; }
    if (/^#\d+$/.test(q)) { const id = +q.slice(1); if (id < N) { results.classList.remove("show"); goto(id); } return; }
    const ql = q.toLowerCase();
    const ids = [];
    D.fns.forEach((n, i) => { if (n.toLowerCase().includes(ql)) ids.push(...callsOf[i]); });
    ids.sort((a, b) => tEff(b) - tEff(a));
    showResults(ids.length.toLocaleString() + " calls matching “" + q + "” (slowest first)", ids);
  }, 150);
});
btnErr.onclick = () => {
  if (!raisedIds.length) { showResults("No exception was raised in this trace", []); return; }
  showResults(raisedIds.length + " calls where an exception was raised", raisedIds,
    id => "— " + String(det(id).exception || "").split("\n")[0].slice(0, 120));
};

// ── keyboard: ↑ ↓ move, → expand, ← collapse / parent ───────────────────────
addEventListener("keydown", e => {
  if (tab !== "tree" || e.target.tagName === "INPUT" || selected < 0) return;
  const rows = [...treeEl.querySelectorAll(".row[data-id]")].filter(r => r.offsetParent !== null);
  const i = rows.findIndex(r => +r.dataset.id === selected);
  if (e.key === "ArrowDown" && i < rows.length - 1) { select(+rows[i + 1].dataset.id); rows[i + 1].scrollIntoView({ block: "nearest" }); }
  else if (e.key === "ArrowUp" && i > 0) { select(+rows[i - 1].dataset.id); rows[i - 1].scrollIntoView({ block: "nearest" }); }
  else if (e.key === "ArrowRight") toggleNode(selected, true);
  else if (e.key === "ArrowLeft") {
    const s = nodeState.get(selected);
    if (s && s.open) toggleNode(selected, false); else if (D.p[selected] >= 0) { reveal(D.p[selected]); select(D.p[selected]); }
  } else return;
  e.preventDefault();
});

// deep links: page.html#n123 opens call #123; #graph, #timeline, #fns, #flame, #tree open that view
const m = /^#n(\d+)$/.exec(location.hash);
if (m && +m[1] < N) { reveal(+m[1]); select(+m[1], { noHash: true }); } else select(0, { noHash: true });
const view = location.hash.slice(1);
if (view === "graph" || view === "timeline") {
  showTab("graph");
  if (view === "timeline") document.querySelector('[data-gview="timeline"]').click();
} else if (["fns", "flame", "tree"].includes(view)) showTab(view);
</script>
