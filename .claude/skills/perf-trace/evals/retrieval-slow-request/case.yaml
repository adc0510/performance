schema_version: "1.1"
name: retrieval-slow-request
expected_outcome: |
  report.md identifies LawRepository.find_law_citations (app/repositories/law_repository.py) as the main
  cost: two calls of about 9 s each (for only 2-4 law ids) running at the same time on the two concurrent
  branches of HybridPipeline.retrieve -- one under retrieve_primary_results/attach_annex_law_identity, one
  inside web-search hydration (cite_primary_docs -> search_web -> _fetch_page_text -> _html_to_citations) --
  so each sits on its branch's critical path of the ~18.6 s request. The time is spent waiting on the
  database, so the fix targets that query/call (query shape, indexes, batching or caching, or not running it
  per fetched page). Other costs (LLM calls, Solr, Serper, page fetches) are secondary, and perf's own
  overhead (~2%) is not blamed.
